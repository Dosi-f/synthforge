[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthforge"
version = "0.2.1"
description = "Synthetic data generation toolkit for LLM fine-tuning and evaluation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Dosi-f", email = "Dosi-f@users.noreply.github.com"}
]
keywords = [
    "synthetic-data",
    "llm",
    "fine-tuning",
    "dataset-generation",
    "nlp",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "datasets>=2.19.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
gpu = [
    "vllm>=0.5.0",
    "torch>=2.3.0",
    "flash-attn>=2.5.0",
    "xformers>=0.0.26",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
synthforge = "synthforge.cli:app"

[project.urls]
Homepage = "https://github.com/Dosi-f/synthforge"
Repository = "https://github.com/Dosi-f/synthforge"
Issues = "https://github.com/Dosi-f/synthforge/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
