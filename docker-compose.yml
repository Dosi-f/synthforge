# SynthForge Docker Compose
# For local development with GPU support.

version: "3.8"

services:
  synthforge:
    build: .
    image: synthforge:latest
    container_name: synthforge
    volumes:
      - ./outputs:/app/outputs
      - ./configs:/app/configs
      - ./.cache:/app/.cache
      - ./.env:/app/.env:ro
    environment:
      - ROCR_VISIBLE_DEVICES=${ROCR_VISIBLE_DEVICES:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: amd
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    # Override entrypoint for interactive use:
    # entrypoint: ["/bin/bash"]

